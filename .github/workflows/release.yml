name: Release to PyPI

# Publishes via Trusted Publishing (OIDC) — no API token needed.
#
# TEMPORARY: this targets TestPyPI while we validate the release pipeline.
# To go live on production PyPI, remove the `with: repository-url:` step below
# and set up the trusted publisher on https://pypi.org instead.
#
# One-time setup on https://test.pypi.org/manage/account/publishing/:
#   project: saidex, owner: mlauf-labs, repository: SAIDEX,
#   workflow: release.yml, environment: pypi
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
