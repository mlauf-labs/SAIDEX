name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing

  # Runs the suite against the lowest versions pyproject.toml allows, so the
  # declared dependency floors cannot silently drift away from what works.
  test-lowest:
    name: test (lowest dependency versions)
    runs-on: ubuntu-latest
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Resolve and install the lowest allowed versions
        run: |
          uv lock
          uv sync --group dev

      - name: Show resolved runtime versions
        run: uv tree --depth 1

      - name: Run tests
        run: uv run pytest

      # The langgraph dev dependency pulls langchain-core above its own floor,
      # so the core suite is run once more on the declared minimum. Keep this
      # version in sync with `langchain-core>=` in pyproject.toml.
      - name: Run core tests on the langchain-core floor
        run: |
          uv pip install "langchain-core==0.3.69"
          uv run --no-sync pytest \
            --ignore=tests/test_langgraph_toolnode.py \
            --ignore=tests/test_tool_node_observability.py

  # Smoke test on the free-threaded (no-GIL) build of Python 3.14. Deliberately
  # non-blocking and left out of `ci-success`: some dependencies may not ship
  # free-threaded wheels yet, so a failure here is informational, not a gate.
  test-free-threaded:
    name: test (free-threaded Python 3.14t, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PYTHON_GIL: "0"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Confirm the GIL is disabled
        run: uv run python -c "import sys; print('GIL enabled:', sys._is_gil_enabled())"

      - name: Run tests
        run: uv run pytest -q

  # Single aggregated check to use as the required status check in branch
  # protection — stays stable even when the Python matrix above changes.
  ci-success:
    name: CI success
    if: always()
    needs: [test, test-lowest]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test job failed
        if: needs.test.result != 'success' || needs.test-lowest.result != 'success'
        run: exit 1
